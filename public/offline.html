<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GarageFlo</title>
  <style>
    :root {
      --bg: #191E2D;
      --text: #F7F9FC;
      --muted: #B8C0CC;
      --primary: #00B8F5;
      --card: #292B33;
      --border: #484D59;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
      gap: 1.5rem;
    }

    .logo {
      width: 80px;
      height: 80px;
      border-radius: 18px;
      object-fit: cover;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem 1.5rem;
      max-width: 320px;
      width: 100%;
    }

    h1 {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 0.875rem;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.625rem 1rem;
      background: var(--primary);
      color: #061018;
      border: none;
      border-radius: 8px;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/logo.jpeg" alt="GarageFlo" class="logo" onerror="this.style.display='none'" />
    <div class="card">
      <h1>No Connection</h1>
      <p>GarageFlo can't reach the server right now. Check your internet connection and try again.</p>
      <button onclick="window.location.reload()">
        Try Again
      </button>
    </div>
  </div>
</body>
</html>
