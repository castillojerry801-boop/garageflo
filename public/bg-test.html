<!DOCTYPE html><html><head>
<style>
* { box-sizing: border-box; }
body { background: #191E2D; margin: 0; min-height: 100vh; font-family: sans-serif; color: #F7F9FC; }
.nav { position: sticky; top: 0; z-index: 50; height: 56px; background: rgba(25,30,45,0.9); border-bottom: 1px solid #484D59; display: flex; align-items: center; padding: 0 24px; gap: 8px; backdrop-filter: blur(12px); }
.nav-logo { width: 24px; height: 24px; border-radius: 6px; }
.nav-title { font-size: 14px; font-weight: 700; }
.nav-title span { color: #00B8F5; }
.content { position: relative; z-index: 10; padding: 24px 24px 40px; max-width: 900px; margin: 0 auto; }
h1 { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
p.sub { color: #B8C0CC; font-size: 13px; margin: 0 0 20px; }
.metrics { background: #292B33; border: 1px solid #484D59; border-radius: 12px; display: grid; grid-template-columns: repeat(3,1fr); overflow: hidden; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.28), 0 1px 2px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.04); }
.metric { padding: 12px 16px; border-right: 1px solid #484D59; }
.metric:last-child { border-right: none; }
.metric .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: #B8C0CC; }
.metric .label.accent { color: #00B8F5; opacity: 0.7; }
.metric .val { font-size: 24px; font-weight: 700; color: #F7F9FC; }
.section-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: #00B8F5; opacity: 0.6; margin-bottom: 10px; }
.card { background: #292B33; border: 1px solid #484D59; border-radius: 12px; padding: 16px 20px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.28), 0 1px 2px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.04); }
.card h3 { margin: 0 0 2px; font-size: 15px; font-weight: 700; color: #F7F9FC; }
.card .subtitle { margin: 0; font-size: 12px; color: #B8C0CC; }
.card .type-badge { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: #00B8F5; opacity: 0.7; margin-left: 8px; }
.card .row { display:flex; justify-content:space-between; align-items:center; margin-top:12px; padding-top:10px; border-top:1px solid rgba(72,77,89,0.5); font-size:12px; color:#B8C0CC; }

/* Full-screen background */
.bg-wrap { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: #191E2D; }
.bg-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.bg-tint { position: absolute; inset: 0; background: rgba(25,30,45,0.52); }
</style></head><body>
<div class="bg-wrap" aria-hidden="true">
  <img src="/garage-icon.png" style="filter: contrast(0.88) brightness(1.02); mask-image: linear-gradient(to bottom, black 42%, transparent 76%); -webkit-mask-image: linear-gradient(to bottom, black 42%, transparent 76%)" alt="" draggable="false">
  <div class="bg-tint"></div>
</div>
<nav class="nav">
  <img src="/logo.jpeg" class="nav-logo" alt="">
  <span class="nav-title">Garage<span>Flo</span></span>
</nav>
<div class="content">
  <h1>My Garage</h1>
  <p class="sub">Everything you own. Everything you need to maintain.</p>
  <div class="metrics">
    <div class="metric"><div class="label accent">Vehicles</div><div class="val">2</div></div>
    <div class="metric"><div class="label">Overdue</div><div class="val">0</div></div>
    <div class="metric"><div class="label">Due Soon</div><div class="val">0</div></div>
  </div>
  <div class="section-label">2 Vehicles</div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div>
        <h3>Mazda 6 <span class="type-badge">Car</span></h3>
        <p class="subtitle">2012 Mazda 6</p>
      </div>
    </div>
    <div class="row"><span>167,953 mi</span><span style="color:#22c55e;display:flex;align-items:center;gap:5px"><span style="width:6px;height:6px;border-radius:50%;background:#22c55e;display:inline-block"></span>Up to Date</span></div>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div>
        <h3>2021 Honda Civic <span class="type-badge">Car</span></h3>
        <p class="subtitle">2021 Honda Civic</p>
      </div>
    </div>
    <div class="row"><span>32,100 mi</span><span style="color:#22c55e;display:flex;align-items:center;gap:5px"><span style="width:6px;height:6px;border-radius:50%;background:#22c55e;display:inline-block"></span>Up to Date</span></div>
  </div>
</div>
</body></html>
